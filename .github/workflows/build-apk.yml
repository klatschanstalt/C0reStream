name: Build C0reStream APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --list --channel=3 > /tmp/sdk-packages.txt
          PLATFORM=$(awk -F '|' '{gsub(/^[ \t]+|[ \t]+$/, "", $1); if ($1 == "platforms;android-37.1") print $1}' /tmp/sdk-packages.txt | sort -u | tail -1)
          if [[ -z "$PLATFORM" ]]; then
            grep -iE '37|cinnamon' /tmp/sdk-packages.txt || true
            exit 1
          fi
          sdkmanager --install --channel=3 "$PLATFORM" 'build-tools;37.0.0'
      - run: gradle --warning-mode all :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Validate release compilation
        run: gradle :app:assembleRelease --stacktrace
      - name: Generate APK checksum
        if: success()
        run: cd app/build/outputs/apk/debug && mv app-debug.apk C0reStream-debug.apk && sha256sum *.apk > SHA256SUMS
      - name: Upload database schemas
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Print lint diagnostics
        if: always()
        run: |
          if test -f app/build/reports/lint-results-debug.txt; then cat app/build/reports/lint-results-debug.txt; fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: C0reStream-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: preview-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Download verified build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --name C0reStream-debug --dir preview
      - name: Verify and publish development APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd preview
          sha256sum --check SHA256SUMS
          test -s C0reStream-debug.apk
          TAG="preview-${BUILD_SHA:0:12}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Preview already published; preserving existing assets."
          else
            gh release create "$TAG" C0reStream-debug.apk SHA256SUMS --target "$BUILD_SHA" --prerelease --latest=false --title "C0reStream development preview ${BUILD_SHA:0:12}" --notes "CI-built debug APK for testing only. Not a production release. Debug signing keys may change between builds; uninstalling can erase app data. Do not enter sensitive credentials until security findings are resolved."
          fi
