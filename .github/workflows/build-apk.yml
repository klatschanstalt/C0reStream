name: Build C0reStream

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.1 build-tools;37.0.0 platform-tools'
      - name: Validate version metadata
        run: |
          set -euo pipefail
          version_code=$(grep '^versionCode=' version.properties | cut -d= -f2)
          version_name=$(grep '^versionName=' version.properties | cut -d= -f2)
          [[ "$version_code" =~ ^[0-9]+$ ]] && [ "$version_code" -gt 0 ] || { echo "Invalid versionCode"; exit 1; }
          [[ "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid versionName"; exit 1; }
          VERSION_NAME="$version_name" python3 - <<'PY'
          import json, os, re
          # release-notes.json carries the notes of the version that is being prepared.
          # update.json must keep describing the last *published* version until the
          # release job has verified and published the new artifact (see below).
          pending = json.load(open('release-notes.json'))
          assert pending.get('version') == os.environ['VERSION_NAME'], 'release-notes.json version mismatch'
          for key in ('notes_de', 'notes_en', 'notes_fr'):
              assert isinstance(pending.get(key), str) and pending[key].strip(), f'missing {key}'
          published = json.load(open('update.json'))
          assert re.fullmatch(r'\d+\.\d+\.\d+', published['latestVersion']), 'invalid published version'
          assert published['apkUrl'].startswith('https://'), 'published APK URL must be HTTPS'
          assert re.fullmatch(r'[0-9a-f]{64}', published['sha256']), 'invalid published checksum'
          assert published['sha256'] != '0' * 64, 'placeholder checksum in published metadata'
          PY
      - name: Check version monotonicity
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version_code=$(grep '^versionCode=' version.properties | cut -d= -f2)
          version_name=$(grep '^versionName=' version.properties | cut -d= -f2)
          latest_tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -n "$latest_tag" ] && [ "$latest_tag" != "v$version_name" ]; then
            published_code=$(gh api "repos/$GH_REPO/contents/version.properties?ref=$latest_tag" --jq .content \
              | base64 -d | grep '^versionCode=' | cut -d= -f2)
            [ "$version_code" -gt "$published_code" ] || {
              echo "versionCode must exceed published release $latest_tag ($published_code)"; exit 1;
            }
          fi
      - name: Unit tests and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7

  instrumented:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Android 11 (API 30) and Android 16 (API 36). API 37 is intentionally not in
        # the matrix: sdkmanager publishes `system-images;android-37.0;aosp_atd` but
        # not the `android-37;aosp_atd` id the emulator runner resolves from api-level 37.
        # Verify runner support before adding it; keep 30/36 as the stable matrix.
        api-level: [30, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.1 build-tools;37.0.0 platform-tools'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          if command -v docker >/dev/null 2>&1; then docker rmi -f $(docker images -q) || true; fi
          df -h /home/runner/.android || true
      - name: Instrumented tests (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: aosp_atd
          arch: x86_64
          disk-size: 4096M
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-reports-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7

  publish-production:
    needs: [verify, instrumented]
    # Never sign or publish for pull requests (including fork PRs). Only trusted main pushes.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # Serialise releases across commits; the tag guard below is not atomic.
      group: production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.1 build-tools;37.0.0 platform-tools'
      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          if [[ -n "${KEYSTORE_BASE64:-}" && -n "${KEYSTORE_PASSWORD:-}" && \
                -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" && -n "${EXPECTED_CERT:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Production signing configuration is incomplete; skipping signed release."
          fi
      - name: Decode durable signing key
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
      - name: Build signed release
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace
      - name: Verify APK version metadata
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          expected_version_code=$(grep '^versionCode=' version.properties | cut -d= -f2)
          expected_version_name=$(grep '^versionName=' version.properties | cut -d= -f2)
          badging=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk)
          actual_version_code=$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)
          actual_version_name=$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
          [ "$actual_version_code" = "$expected_version_code" ] || { echo "APK versionCode mismatch"; exit 1; }
          [ "$actual_version_name" = "$expected_version_name" ] || { echo "APK versionName mismatch"; exit 1; }
      - name: Sign resource manifest
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:signResourceManifest :app:verifyResourceManifest --stacktrace
      - name: Verify signature and checksum
        id: artifact
        if: steps.signing.outputs.available == 'true'
        env:
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          APK=app-release.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest/ {print $NF; exit}' | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Signing certificate fingerprint mismatch; refusing to publish."
            exit 1
          fi
          cp "$APK" C0reStream.apk
          sha256sum C0reStream.apk > SHA256SUMS
          echo "apk_sha=$(sha256sum C0reStream.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload signed APK for verification
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: C0reStream-signed-verification
          path: |
            app/build/outputs/apk/release/C0reStream.apk
            app/build/outputs/apk/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Publish release
        id: publish
        # Manual dispatches build and upload the signed APK for verification but never publish.
        if: steps.signing.outputs.available == 'true' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          cp ../../../../../resources/manifest.json resources.json
          cp ../../../../../resources/manifest.sig resources.sig
          TAG="v$(grep '^versionName=' ../../../../../version.properties | cut -d= -f2)"
          python3 - <<'PY' > release-notes.md
          import json
          d = json.load(open('../../../../../release-notes.json'))
          lines = [f"# C0reStream {d['version']}", ""]
          for key, header in (('de', 'Deutsch'), ('en', 'English'), ('fr', 'Français')):
              note = d.get(f'notes_{key}', '').strip()
              if note:
                  lines += [f"## {header}", "", note, ""]
          lines += ["---", "", "Signiertes Produktions-APK. Vor der Installation SHA256SUMS und Signaturzertifikat prüfen.", "", "Signed production APK. Verify SHA256SUMS and the signing certificate before installation.", "", "APK de production signé. Vérifiez SHA256SUMS et le certificat de signature avant l'installation."]
          print('\n'.join(lines))
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving immutable assets. Bump version.properties for a new release."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release create "$TAG" C0reStream.apk SHA256SUMS resources.json resources.sig --target "$BUILD_SHA" \
            --title "C0reStream $TAG" --notes-file release-notes.md
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      # The checksum is derived from the exact signed artifact that was just published.
      # No Gradle invocation happens after this point, so no second build can change it.
      - name: Verify public release artifact
        id: public
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
          EXPECTED_SHA: ${{ steps.artifact.outputs.apk_sha }}
          VERSION: ${{ steps.publish.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          url="https://github.com/$GH_REPO/releases/download/$VERSION/C0reStream.apk"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$url" -o public.apk; then break; fi
            [ "$attempt" -lt 5 ] && sleep 10
          done
          test -s public.apk
          actual=$(sha256sum public.apk | cut -d' ' -f1)
          [ "$actual" = "$EXPECTED_SHA" ] || { echo "Public APK checksum mismatch"; exit 1; }
          cmp -s public.apk C0reStream.apk || { echo "Public APK differs from published artifact"; exit 1; }
          sha256sum SHA256SUMS >/dev/null
          grep -q "$actual  C0reStream.apk" SHA256SUMS || { echo "SHA256SUMS mismatch"; exit 1; }
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --print-certs public.apk >/dev/null
          public_cert="$("$APKSIGNER" verify --print-certs public.apk \
            | awk -F': ' '/certificate SHA-256 digest/ {print $NF; exit}' | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          [ "$public_cert" = "$(printf '%s' "$EXPECTED_CERT" | tr -d '[:space:]' | tr 'A-Z' 'a-z')" ] \
            || { echo "Public APK certificate mismatch"; exit 1; }
          badging=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging public.apk)
          public_code=$(printf '%s\n' "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -n1)
          public_name=$(printf '%s\n' "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n1)
          echo "$badging" | grep -q "name='pw.c0re.stream'" || { echo "Public APK package mismatch"; exit 1; }
          [ "$public_code" = "$(grep '^versionCode=' ../../../../../version.properties | cut -d= -f2)" ] \
            || { echo "Public APK versionCode mismatch"; exit 1; }
          [ "$public_name" = "$VERSION" ] || { echo "Public APK versionName mismatch"; exit 1; }

      # Only after the public artifact is verified does update.json reference the new
      # version. The APK is mirrored at a credential-free HTTPS URL so installed
      # v1.7.0/v1.7.1 clients (whose strict redirect guard blocks GitHub's signed
      # asset hop) can still update. This is a normal new commit: no amend, no force
      # push, no tag or asset rewrite.
      - name: Publish update metadata
        if: steps.public.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ steps.artifact.outputs.apk_sha }}
          VERSION: ${{ steps.publish.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version_number="${VERSION#v}"
          mirror_dir="downloads/$VERSION"
          mirror_url="https://raw.githubusercontent.com/$GH_REPO/main/$mirror_dir/C0reStream.apk"
          mkdir -p "$mirror_dir"
          cp app/build/outputs/apk/release/C0reStream.apk "$mirror_dir/C0reStream.apk"
          VERSION_NAME="$version_number" VERSION_TAG="$VERSION" MIRROR_URL="$mirror_url" \
          EXPECTED_SHA="$EXPECTED_SHA" python3 - <<'PY' > update.json.new
          import json, os
          pending = json.load(open('release-notes.json'))
          assert pending['version'] == os.environ['VERSION_NAME']
          data = {
              'latestVersion': os.environ['VERSION_NAME'],
              'notes': pending['notes_de'],
              'notes_de': pending['notes_de'],
              'notes_en': pending['notes_en'],
              'notes_fr': pending['notes_fr'],
              'apkUrl': os.environ['MIRROR_URL'],
              'sha256': os.environ['EXPECTED_SHA'],
          }
          print(json.dumps(data, ensure_ascii=False, indent=4))
          PY
          mv update.json.new update.json
          git config user.name "C0reStream Release"
          git config user.email "release@c0re.stream"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          git add update.json "$mirror_dir/C0reStream.apk"
          git commit -m "release: publish $VERSION update metadata [skip ci]"
          git push origin HEAD:main
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$mirror_url" -o /tmp/opencode-mirror.apk; then break; fi
            [ "$attempt" -lt 5 ] && sleep 10
          done
          test -s /tmp/opencode-mirror.apk
          mirror_sha=$(sha256sum /tmp/opencode-mirror.apk | cut -d' ' -f1)
          [ "$mirror_sha" = "$EXPECTED_SHA" ] || { echo "Public mirror checksum mismatch"; exit 1; }
          echo "$MIRROR_URL verified: $mirror_sha"
