name: Build C0reStream

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.1 build-tools;37.0.0 platform-tools'
      - name: Unit tests, lint and release build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
      - name: Upload database schemas
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  instrumented:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Android 11 (API 30) and Android 16 (API 36). Add newer API levels once
        # the emulator runner publishes matching system images.
        api-level: [30, 36]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.1 build-tools;37.0.0 platform-tools'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space for emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          if command -v docker >/dev/null 2>&1; then docker rmi -f $(docker images -q) || true; fi
          df -h /home/runner/.android || true
      - name: Instrumented tests (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: aosp_atd
          arch: x86_64
          disk-size: 4096M
          disable-animations: true
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest --stacktrace
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: instrumented-reports-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

  publish-production:
    needs: [verify, instrumented]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    concurrency:
      group: production-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.1 build-tools;37.0.0 platform-tools'
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KEYSTORE_BASE64:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Production signing secrets are not configured; skipping signed release."
          fi
      - name: Decode durable signing key
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
      - name: Build signed release
        if: steps.signing.outputs.available == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease --stacktrace
      - name: Verify signature and publish
        if: steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          APK=app-release.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-256 digest/ {print $NF; exit}' | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          EXPECTED="$(printf '%s' "$EXPECTED_CERT" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo "Signing certificate fingerprint mismatch; refusing to publish."
            exit 1
          fi
          cp "$APK" C0reStream.apk
          sha256sum C0reStream.apk > SHA256SUMS
          TAG="v$(grep '^versionName=' ../../../../../version.properties | cut -d= -f2)"
          BUILD_SHA256="$(sha256sum C0reStream.apk | cut -d' ' -f1)"
          MANIFEST_VERSION="$(python3 -c 'import json; print(json.load(open("../../../../../update.json"))["latestVersion"])')"
          MANIFEST_SHA="$(python3 -c 'import json; print(json.load(open("../../../../../update.json"))["sha256"].lower())')"
          MANIFEST_URL="$(python3 -c 'import json; print(json.load(open("../../../../../update.json"))["apkUrl"])')"
          if [[ "v$MANIFEST_VERSION" != "$TAG" || "$BUILD_SHA256" != "$MANIFEST_SHA" ||
                "$MANIFEST_URL" != https://*"/download/$TAG/"* ]]; then
            echo "update.json does not match the signed release; refusing to publish."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; preserving immutable assets. Bump version.properties for a new release."
            exit 0
          fi
          gh release create "$TAG" C0reStream.apk SHA256SUMS --target "$BUILD_SHA" \
            --title "C0reStream $TAG" --notes "Signed production APK. Verify SHA256SUMS and the signing certificate before installation."
