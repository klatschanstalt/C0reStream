name: Build Ham3L TV APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle --warning-mode all :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Generate APK checksum
        if: success()
        run: cd app/build/outputs/apk/debug && sha256sum *.apk > SHA256SUMS
      - name: Upload database schemas
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - name: Print lint diagnostics
        if: always()
        run: |
          if test -f app/build/reports/lint-results-debug.txt; then cat app/build/reports/lint-results-debug.txt; fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Ham3LTV-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
